name: Mobile layout diagnostic
on:
  push:
    branches: [qa/mobile-layout-20261101]
    paths: [scripts/mobile-layout-diagnostic.mjs, .github/workflows/layout-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps webkit
      - run: node scripts/mobile-layout-diagnostic.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-diagnostic
          path: acceptance-artifacts
          retention-days: 7
