name: Validate strategy, backtest and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and no-lookahead replay tests
        run: npm test
      - name: Real historical replay, 48 hours, BTC ETH SOL AAVE
        run: npm run backtest
      - name: Real API, CORS and top40 five-timeframe scan
        run: npm run verify:api
      - name: Preserve real historical data and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-validation
          path: reports
          retention-days: 7
          if-no-files-found: warn
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
